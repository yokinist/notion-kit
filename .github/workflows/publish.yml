name: Publish

# Run from the Actions tab after bumping a package's version: publishes every
# package whose version is not on npm yet, then tags and releases it
on:
  workflow_dispatch:

permissions:
  contents: write # tags and releases
  id-token: write # npm trusted publishing, with provenance

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            npm publish -w "$dir"
            git tag "$name@$version"
            git push origin "$name@$version"
            gh release create "$name@$version" --title "$name@$version" --generate-notes
          done
