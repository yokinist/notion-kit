name: Publish

# Run from the Actions tab after bumping a package's version. It stages each
# package whose version is not on npm yet; a maintainer then approves it in
# npm's Staged Packages tab (with 2FA) before it goes live.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing, with provenance

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Staged publishing needs npm 11.15.0 or later
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Stage new versions
        run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "$dir" && npm stage publish)
            echo "::notice::Staged $name@$version: approve it in Staged Packages on npmjs.com"
          done
